<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regional Safety Services District Coverage Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --navy:#1b2a4a; --navy2:#243b63; --gold:#c8963e; --logo-yellow:#fcd96b;
    --component:#2f6fed; --subscriber:#e0762a; --boces:#1b2a4a;
    --bg:#f4f6fa; --panel:#ffffff; --border:#dde3ee; --text:#232a36; --muted:#66707f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 18px;}
  #header img{width:78%;max-width:260px;height:auto;display:block;}
  #header .htext{min-width:0;margin-top:12px;}
  #header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px;line-height:1.25;color:#fff;}
  #controls{padding:14px 18px;border-bottom:1px solid var(--border);}
  #controls label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 5px;}
  #controls label:first-child{margin-top:0;}
  .label-row{display:flex;align-items:baseline;justify-content:space-between;}
  .label-row label{margin:10px 0 5px;}
  .mini-links{font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;}
  .mini-links a{color:var(--navy);text-decoration:none;cursor:pointer;}
  .mini-links a:hover{text-decoration:underline;}
  .mini-links span{color:var(--border);margin:0 4px;}
  select, input[type=text]{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fbfcfe;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--border);background:#fbfcfe;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;transition:.15s;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .chip.region.active{background:var(--gold);border-color:var(--gold);color:#3a2c0c;}
  .chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  #legend{padding:12px 18px;border-bottom:1px solid var(--border);font-size:12.5px;}
  #legend .row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  #legend .swatch{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);}
  #count{padding:10px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);}
  #list{flex:1;overflow-y:auto;padding:6px 0;}
  .item{padding:10px 18px;border-bottom:1px solid #eef1f6;cursor:pointer;}
  .item:hover{background:#f7f9fc;}
  .item .name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .item .name .dot{width:9px;height:9px;min-width:9px;border-radius:50%;}
  .item .sub{font-size:11.5px;color:var(--muted);margin-top:2px;margin-left:16px;}
  .item .flag{display:inline-block;margin-left:16px;margin-top:3px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;}
  .flag.corrected{background:#fde3e3;color:#a02020;}
  .flag.verified{background:#dff3e3;color:#1a7a34;}
  #map{flex:1;}
  .popup h3{margin:0 0 4px 0;font-size:15px;color:var(--navy);}
  .popup .meta{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .popup table{border-collapse:collapse;font-size:12.5px;}
  .popup table td{padding:2px 6px 2px 0;vertical-align:top;}
  .popup table td.k{color:var(--muted);white-space:nowrap;}
  .popup .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;}
  .popup .note{margin-top:8px;padding:7px 9px;background:#fff6e5;border-left:3px solid var(--gold);font-size:11.5px;line-height:1.4;border-radius:3px;}
  .popup .note.corr{background:#fdeaea;border-left-color:#c0392b;}
  #notesToggle{padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--navy);cursor:pointer;font-weight:600;background:#f7f9fc;}
  #notesPanel{display:none;padding:12px 18px;font-size:11.5px;line-height:1.5;color:var(--muted);border-top:1px solid var(--border);max-height:220px;overflow-y:auto;background:#fafbfd;}
  #notesPanel b{color:var(--text);}
  #notesPanel ul{margin:6px 0;padding-left:18px;}
  .leaflet-popup-content{margin:12px 14px;}
  .county-tip{font-weight:700;color:#7a1f2b;font-size:11.5px;background:#fff;border:1px solid #7a1f2b;}
</style>
</head>

const map = L.map('map', {zoomControl:true}).setView([41.35,-73.85], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

// County boundaries (US Census TIGERweb), styled bold so they stand out from the light basemap
L.geoJSON(COUNTY_GEOJSON, {
  style: {
    color:'#7a1f2b',
    weight:3,
    opacity:0.85,
    dashArray:'8,4',
    fill:true,
    fillOpacity:0.02,
    fillColor:'#7a1f2b'
  }
}).bindTooltip(function(layer){ return layer.feature.properties.NAME; }, {sticky:true, className:'county-tip'})
  .addTo(map);

let markers = {}; // district -> {marker, data}
let activeClasses = new Set(['Component','Subscriber','BOCES']);
let activeRegions; // Set, populated below once regions are known
let searchTerm = '';

const LOGO_YELLOW = '#fcd96b';
const STAR_POINTS = '12,1 15.09,8.26 23,9.27 17,14.97 18.53,22.82 12,19 5.47,22.82 7,14.97 1,9.27 8.91,8.26';

function makeIcon(cls, flagged){
  if(cls === 'BOCES'){
    const ringFilter = flagged ? 'drop-shadow(0 0 0 3px #c0392b)' : '';
    return L.divIcon({
      className:'',
      html:`<svg width="26" height="26" viewBox="0 0 24 24" style="overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));">
              <polygon points="${STAR_POINTS}" fill="${LOGO_YELLOW}" stroke="#1b2a4a" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>`,
      iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13]
    });
  }
  const color = CLASS_COLOR[cls] || '#888';
  const ring = flagged ? '0 0 0 3px #c0392b' : '0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.25)';
  return L.divIcon({
    className:'',
    html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};box-shadow:${ring};"></div>`,
    iconSize:[18,18], iconAnchor:[9,9], popupAnchor:[0,-9]
  });
}

function popupHtml(d){
  const badgeColor = CLASS_COLOR[d.classification] || '#888';
  let noteHtml = '';
  if(d.note){
    const cls = d.verified === 'corrected' ? 'note corr' : 'note';
    const label = d.verified === 'corrected' ? '⚠ Corrected from source file: ' : 'ℹ Validation note: ';
    noteHtml = `<div class="${cls}"><b>${label}</b>${d.note}</div>`;
  }
  return `
    <div class="popup">
      <h3>${d.district}</h3>
      <div class="meta">${d.county} County — ${d.region}</div>
      <span class="badge" style="background:${badgeColor}">${d.classification}</span>
      <table style="margin-top:8px;">
        <tr><td class="k">Address</td><td>${d.address}</td></tr>
        <tr><td class="k">Unified district</td><td>${d.unified_name || '—'}${d.unified_lea ? ' (LEA '+d.unified_lea+')' : ''}</td></tr>
        <tr><td class="k">Grades served</td><td>${d.grade_low && d.grade_high ? d.grade_low+' – '+d.grade_high : '—'}</td></tr>
        <tr><td class="k">Pin source</td><td>${d.source || '—'}</td></tr>
      </table>
      ${noteHtml}
    </div>`;
}

DATA.forEach(d=>{
  const flagged = d.verified === 'corrected';
  const marker = L.marker([d.lat, d.lon], {icon: makeIcon(d.classification, flagged)});
  marker.bindPopup(popupHtml(d), {maxWidth:320});
  markers[d.district] = {marker, data:d};
});

// Region filter chips (multi-select)
const regions = [...new Set(DATA.map(d=>d.region))].sort();
activeRegions = new Set(regions);
const regionFilterEl = document.getElementById('regionFilter');
const regionChips = {};
regions.forEach(r=>{
  const chip = document.createElement('div');
  chip.className = 'chip region active';
  chip.textContent = r;
  chip.addEventListener('click', ()=>{
    if(activeRegions.has(r)){
      if(activeRegions.size>1){ activeRegions.delete(r); chip.classList.remove('active'); }
    } else {
      activeRegions.add(r); chip.classList.add('active');
    }
    render();
  });
  regionFilterEl.appendChild(chip);
  regionChips[r] = chip;
});
document.getElementById('regionAll').addEventListener('click', ()=>{
  regions.forEach(r=>{ activeRegions.add(r); regionChips[r].classList.add('active'); });
  render();
});
document.getElementById('regionNone').addEventListener('click', ()=>{
  regions.forEach(r=>{ activeRegions.delete(r); regionChips[r].classList.remove('active'); });
  render();
});

// Classification chips
const classFilterEl = document.getElementById('classFilter');
['Component','Subscriber','BOCES'].forEach(c=>{
  const chip = document.createElement('div');
  chip.className = 'chip active';
  const chipDot = c === 'BOCES'
    ? `<span style="color:${LOGO_YELLOW};-webkit-text-stroke:1px #1b2a4a;font-size:14px;line-height:1;">★</span>`
    : `<span class="dot" style="background:${CLASS_COLOR[c]}"></span>`;
  chip.innerHTML = `${chipDot}${c}`;
  chip.addEventListener('click', ()=>{
    if(activeClasses.has(c)){
      if(activeClasses.size>1){ activeClasses.delete(c); chip.classList.remove('active'); }
    } else {
      activeClasses.add(c); chip.classList.add('active');
    }
    render();
  });
  classFilterEl.appendChild(chip);
});

document.getElementById('search').addEventListener('input', e=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

function passesFilter(d){
  if(!activeClasses.has(d.classification)) return false;
  if(!activeRegions.has(d.region)) return false;
  if(searchTerm && !d.district.toLowerCase().includes(searchTerm) && !d.county.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function render(){
  let visible = 0;
  listEl.innerHTML = '';
  DATA.forEach(d=>{
    const {marker} = markers[d.district];
    if(passesFilter(d)){
      if(!map.hasLayer(marker)) marker.addTo(map);
      visible++;
      const item = document.createElement('div');
      item.className = 'item';
      const flagHtml = d.verified === 'corrected' ? '<span class="flag corrected">ADDRESS CORRECTED</span>'
                        : (d.verified === 'verified' ? '<span class="flag verified">VERIFIED</span>' : '');
      const dotHtml = d.classification === 'BOCES'
        ? `<span style="color:${LOGO_YELLOW};-webkit-text-stroke:1px #1b2a4a;font-size:14px;line-height:1;">★</span>`
        : `<span class="dot" style="background:${CLASS_COLOR[d.classification]}"></span>`;
      item.innerHTML = `<div class="name">${dotHtml}${d.district}</div>
                         <div class="sub">${d.county} County · ${d.region}</div>
                         ${flagHtml}`;
      item.addEventListener('click', ()=>{
        map.setView([d.lat, d.lon], 13);
        marker.openPopup();
      });
      listEl.appendChild(item);
    } else {
      if(map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  countEl.textContent = `Showing ${visible} of ${DATA.length} locations`;
}

render();

// Notes panel
const corrected = DATA.filter(d=>d.verified==='corrected');
const nysed = DATA.filter(d=>(d.source||'').includes('NYS Education')).length;
document.getElementById('notesPanel').innerHTML = `
